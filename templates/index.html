<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Fruits & Vegetables ML MODEL</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🍎FRUITS & 🥦VEGETABLES CLASSIFICATION ML MODEL</h1>
        <p class="subtitle">
            Upload an image to identify the FRUITS & VEGETABLES
            and determine if it is FRESH OR ROTTEN.
        </p>
        <!-- UPLOAD CARD -->
        <div class="card">
            <h2>Upload an Image</h2>
            <form method="POST"
                  enctype="multipart/form-data">
                <input
                    type="file"
                    name="image"
                    accept="image/*"
                    required
                >
                <br>
                <button type="submit">
                    🔍 Analyze Image
                </button>
            </form>
        </div>
        <!-- RESULT -->
        {% if image_path %}
        <div class="result-card">
            <h2>Uploaded Image</h2>
            <img
                src="{{ image_path }}"
                alt="Uploaded Image"
                class="uploaded-image"
            >
            <h2>ML Result</h2>
            <div class="prediction">
                🤖 {{ prediction }}
            </div>
        </div>
        {% endif %}
    </div>
    <center><H3 style="font-style: italic;font-family: 'Times New Roman', Times, serif;">MADE BY: HASSAN ZAMAN </H3></center>
</body>
</html>
